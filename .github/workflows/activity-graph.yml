name: Update Contribution Graph

on:
  schedule:
    - cron: "0 3 * * *"

  push:
    paths:
      - ".github/workflows/activity-graph.yml"
      - ".github/scripts/generate_activity_graph.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate smooth contribution graph
        run: python3 .github/scripts/generate_activity_graph.py
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/activity-graph.svg

          git commit -m "Update contribution graph" || exit 0

          git push
